name: release

# Cut a release by pushing a tag vX.Y.Z that matches package.json (see docs/RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64 }
          # GitHub retired the macos-13 image; macos-15-intel is the x64 macOS runner
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Build single executable
        run: node scripts/build-sea.mjs
      - name: Check the build is for ${{ matrix.platform }}
        run: test -f "build/agentmbx-${{ matrix.platform }}"
      - name: Smoke test (init, send, inbox, MCP over stdio)
        run: node scripts/smoke-sea.mjs "build/agentmbx-${{ matrix.platform }}"
      - name: Import the AgentMBX code-signing identity (keeps the owner key's Keychain trust across releases)
        if: matrix.platform == 'darwin-arm64'
        env:
          MBX_CODESIGN_P12: ${{ secrets.MBX_CODESIGN_P12 }}
          MBX_CODESIGN_P12_PASSWORD: ${{ secrets.MBX_CODESIGN_P12_PASSWORD }}
          MBX_CODESIGN_IDENTITY_NAME: ${{ secrets.MBX_CODESIGN_IDENTITY }}
        run: |
          if [ -z "$MBX_CODESIGN_P12" ]; then echo "no MBX_CODESIGN_P12 secret: the app will be ad-hoc signed"; exit 0; fi
          KC="$RUNNER_TEMP/agentmbx-signing.keychain-db"; KCPASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$MBX_CODESIGN_P12" | base64 --decode > "$RUNNER_TEMP/agentmbx-signing.p12"
          security import "$RUNNER_TEMP/agentmbx-signing.p12" -k "$KC" -P "$MBX_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/agentmbx-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "MBX_CODESIGN_IDENTITY=${MBX_CODESIGN_IDENTITY_NAME:-AgentMBX Code Signing}" >> "$GITHUB_ENV"
          echo "MBX_CODESIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build AgentMBX.app (branded macOS notifications + Touch ID owner-key helper; universal, built once)
        if: matrix.platform == 'darwin-arm64'
        run: bash scripts/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'darwin-arm64'
        with:
          name: agentmbx-macos-app
          path: build/AgentMBX-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: agentmbx-${{ matrix.platform }}
          path: build/agentmbx-${{ matrix.platform }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: agentmbx-*
          merge-multiple: true
      - name: SHA256SUMS + manifest.json
        run: node scripts/make-manifest.mjs release "$GITHUB_REF_NAME"
      - name: Sign manifest.json (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          # set only for the one release that rotates the key (docs/RELEASING.md)
          RELEASE_ROTATION_PREVIOUS_KEY: ${{ vars.RELEASE_ROTATION_PREVIOUS_KEY }}
        run: node scripts/sign-manifest.mjs release/manifest.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh release/install.sh
          chmod +x release/agentmbx-*
          (cd release && sha256sum -c SHA256SUMS)
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --verify-tag --generate-notes --title "AgentMBX $GITHUB_REF_NAME" \
            release/agentmbx-* release/AgentMBX-macos.zip release/SHA256SUMS release/manifest.json release/manifest.json.sig release/install.sh

  npm:
    # Trusted publishing (T013): npm exchanges this job's GitHub OIDC token, so there is no npm token or secret.
    # The trust binding on npmjs.com names this repo and this workflow filename; renaming release.yml breaks it.
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm publish
        run: |
          tag=latest; case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          # A re-run after a failed smoke check must not try to publish the same version again.
          if npm view "agentmbx@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          npm publish --provenance --access public --tag "$tag"
      - name: Install the published package and run it
        # Accepted is not yet visible: poll the registry, never re-publish (a version cannot be published twice).
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do npm view "agentmbx@$v" version >/dev/null 2>&1 && break; sleep 10; done
          npm view "agentmbx@$v" version dist.integrity
          # The tarball reaches the CDN minutes after the metadata (v0.5.28: 404 for over 5 minutes).
          url="$(npm view "agentmbx@$v" dist.tarball)"
          for i in $(seq 1 90); do curl -sfI "$url" >/dev/null && break; sleep 20; done
          home="$(mktemp -d)"; prefix="$(mktemp -d)"
          HOME="$home" npm install -g --prefix "$prefix" "agentmbx@$v"
          HOME="$home" "$prefix/bin/agentmbx" --version | grep -F "agentmbx $v"
